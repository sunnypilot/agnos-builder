name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build kernel and system
    runs-on: [self-hosted, tier-high, arm, type-cax41, type-cax31, image-arm-snapshot-sunnylink-arm]
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
    - name: Install host tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends git-lfs gh zstd xz-utils

    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout kernel
      env:
        KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
      run: |
        eval "$(ssh-agent -s)"
        ssh-add - <<< "$KERNEL_DEPLOY_KEY"
        git -c url."git@github.com:sunnypilot/".insteadOf="https://github.com/sunnypilot/" \
          -c core.sshCommand="ssh -o StrictHostKeyChecking=accept-new" \
          submodule update --init --depth 1
        ssh-agent -k

    - name: Get commit message
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo 'LAST_COMMIT_MESSAGE<<EOF'
          gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.sha }} --jq .commit.message
          echo EOF
        } | tee -a $GITHUB_ENV

    - name: Get kernel submodule ref
      id: kernel-submodule
      run: echo "ref=$(git ls-tree HEAD | awk '$4 == "agnos-kernel-sdm845"' | awk '{print $3}')" | tee -a $GITHUB_OUTPUT

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-kernel-${{ steps.kernel-submodule.outputs.ref }}-${{ github.run_id }}
        restore-keys: |
          ccache-kernel-${{ steps.kernel-submodule.outputs.ref }}-
          ccache-kernel-

    - name: Build kernel
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_MAXSIZE: 5G
      run: ./build_kernel.sh

    - name: Update VERSION
      if: github.event_name == 'pull_request'
      run: |
        echo -n $(cat VERSION)-$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7) > VERSION

    - name: Build system
      env:
        GIT_HASH: ${{ github.event.pull_request.head.sha }}
      run: ./build_system.sh

    - name: Statistics
      id: stats
      run: |
        {
          echo 'stats_summary<<EOF'
          scripts/analyze-agnos-rootfs.sh
          echo EOF
        } | tee -a $GITHUB_OUTPUT

    - name: Package OTA
      if: github.event_name == 'pull_request' && contains(env.LAST_COMMIT_MESSAGE, '[upload]')
      env:
        AGNOS_UPDATE_URL: https://huggingface.co/sunnypilot/agnos-ci/resolve/main/pr-${{ github.event.number }}
      run: |
        scripts/package_ota.py
        cd output/ota
        mv ota.json agnos.json && rm ota-staging.json
        rm -f *.img

    - name: Push to Hugging Face
      if: github.event_name == 'pull_request' && contains(env.LAST_COMMIT_MESSAGE, '[upload]')
      working-directory: output/ota
      env:
        HF_OIDC_RESOURCE: sunnypilot/agnos-ci
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        ~/.local/bin/hf upload sunnypilot/agnos-ci . "pr-${{ github.event.number }}" --commit-message "build artifacts for PR #${{ github.event.number }}"
        {
          echo 'XZ_FILES<<EOF'
          for file in *.xz; do
            echo "* [$file](https://huggingface.co/sunnypilot/agnos-ci/resolve/main/pr-${{ github.event.number }}/$file)"
          done
          echo EOF
        } >> $GITHUB_ENV
        echo "VERSION=$(cat ../../VERSION)" >> $GITHUB_ENV

    - name: Comment on PR
      if: github.event_name == 'pull_request' && contains(env.LAST_COMMIT_MESSAGE, '[upload]')
      uses: thollander/actions-comment-pull-request@fabd468d3a1a0b97feee5f6b9e499eab0dd903f6
      with:
        message: |
          <!-- _(run_id **${{ github.run_id }}**)_ -->
          ## :white_check_mark: AGNOS update ${{ env.VERSION }} ready
          In an openpilot branch, download <a href="https://huggingface.co/sunnypilot/agnos-ci/resolve/main/pr-${{ github.event.number }}/agnos.json">agnos.json</a> in `openpilot/common/hardware/comma/` and update `AGNOS_VERSION` to "${{ env.VERSION }}" in `launch_env.sh`.

          For flashing locally, download and unarchive the images in `agnos-builder/output` and flash with `./flash_all.sh`.

          ### Images:
          ${{ env.XZ_FILES }}

          ### Stats:
          ```
          ${{ steps.stats.outputs.stats_summary }}
          ```
        comment_tag: run_id
        mode: recreate
