name: push and comment

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  push-and-comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[upload]')
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: agnos-artifacts
          path: ${{ github.workspace }}/ci-artifacts

      - name: Read PR number and VERSION
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = fs.readFileSync('${{ github.workspace }}/ci-artifacts/PR', 'utf8').trim();
            core.exportVariable('PR_NUMBER', prNumber);
            const version = fs.readFileSync('${{ github.workspace }}/ci-artifacts/VERSION', 'utf8').trim();
            core.exportVariable('VERSION', version);

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push boot, system and agnos.json
        working-directory: ${{ github.workspace }}/ci-artifacts
        env:
          HF_OIDC_RESOURCE: sunnypilot/agnos-ci
        run: |
          # PR number comes from the artifact, so it may come from a fork: only digits go into the path
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "bad PR number: $PR_NUMBER"; exit 1; }
          mv ota.json agnos.json && rm ota-staging.json
          # raw system image is 4.7GB and nothing on device reads it; the .xz is enough for flashing
          rm -f *.img
          hf upload sunnypilot/agnos-ci . "pr-$PR_NUMBER" --commit-message "build artifacts for PR #$PR_NUMBER"

      - name: List .xz files with links
        working-directory: ${{ github.workspace }}/ci-artifacts
        run: |
          {
            echo 'XZ_FILES<<EOF'
            for file in *.xz; do
              echo "* [$file](https://huggingface.co/sunnypilot/agnos-ci/resolve/main/pr-${{ env.PR_NUMBER }}/$file)"
            done
            echo EOF
          } >> $GITHUB_ENV

      - name: Read agnos_stats.txt
        working-directory: ${{ github.workspace }}/ci-artifacts
        run: |
          {
            echo 'AGNOS_STATS<<EOF'
            cat agnos_stats.txt
            echo EOF
          } >> $GITHUB_ENV

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@fabd468d3a1a0b97feee5f6b9e499eab0dd903f6
        with:
          message: |
            <!-- _(run_id **${{ github.event.workflow_run.id }}**)_ -->
            ## :white_check_mark: AGNOS update ${{ env.VERSION }} ready
            In an openpilot branch, download <a href="https://huggingface.co/sunnypilot/agnos-ci/resolve/main/pr-${{ env.PR_NUMBER }}/agnos.json">agnos.json</a> in `openpilot/common/hardware/comma/` and update `AGNOS_VERSION` to "${{ env.VERSION }}" in `launch_env.sh`.

            For flashing locally, download and unarchive the images in `agnos-builder/output` and flash with `./flash_all.sh`.

            ### Images:
            ${{ env.XZ_FILES }}

            ### Stats:
            ```
            ${{ env.AGNOS_STATS }}
            ```
          pr_number: ${{ env.PR_NUMBER }}
          comment_tag: run_id
          mode: recreate
